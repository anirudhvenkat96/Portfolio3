title: Vonge
url: "https://venkatanirudh.com"
baseurl: ""

google_analytics: G-FVK3QEDQFZ

plugins:
  - jekyll-bookshop
  - jekyll-sitemap

# Multiple bookshops can be used on one website,
# or different production / staging locations.
bookshop_locations:
  - ../component-library

exclude:
  - postcss.config.js
  - node_modules

include:
  - _cloudcannon

collections_dir: 'collections'

collections:
  pages:
    output: true
    permalink: /:title
  projects:
    output: true
    permalink: /project/:slug
  testimonials:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: pages
      path: _pages/index.html
    values:
      permalink: /
  - scope:
      type: projects
    values:
      layout: project
